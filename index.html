<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d8a">
  <title>고입 일정</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <header class="top">
    <h1>고입 일정</h1>
    <span id="today-label"></span>
  </header>
  <p id="boot" class="notice boot">일정을 불러오는 중입니다. 이 문구가 계속 보이면 파일을 직접 열지 말고 주소(http://…)로 열어 주세요.</p>
  <main id="main" class="layout">
    <section class="calendar" aria-label="달력">
      <div class="month-nav">
        <button id="prev" type="button" aria-label="이전 달">‹</button>
        <h2 id="month-title"></h2>
        <button id="next" type="button" aria-label="다음 달">›</button>
      </div>
      <div class="weekdays" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div id="grid" class="grid"></div>
      <ul id="legend" class="legend"></ul>
    </section>
    <section class="side" aria-label="다가오는 일정">
      <h2>다가오는 일정</h2>
      <ul id="upcoming" class="upcoming"></ul>
    </section>
  </main>
  <script type="module" src="./assets/app.js"></script>
</body>
</html>
